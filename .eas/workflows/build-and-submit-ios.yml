# main에 push될 때마다 자동으로 iOS 프로덕션 빌드 + TestFlight 제출.
# 2026-10-07에 연결 테스트.
name: iOS build and submit

on:
  push:
    branches: ['main']

jobs:
  build_ios:
    name: Build iOS
    type: build
    params:
      platform: ios
      profile: production

  submit_ios:
    name: Submit to TestFlight
    needs: [build_ios]
    type: submit
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production
